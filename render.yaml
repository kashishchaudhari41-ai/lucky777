services:
  - type: web
    name: lucky777
    runtime: node
    plan: free
    buildCommand: npx -y pnpm@10 install --no-frozen-lockfile && BASE_PATH=/admin/ PORT=3000 npx -y pnpm@10 --filter @workspace/admin-panel run build && npx -y pnpm@10 --filter @workspace/api-server run build
    startCommand: node --enable-source-maps ./artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: APK_URL
        sync: false
      - key: EXPO_ACCESS_TOKEN
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: GIT_LFS_SKIP_SMUDGE
        value: "1"
