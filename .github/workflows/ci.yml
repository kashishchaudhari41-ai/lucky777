name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run typecheck
      - name: Build admin panel and API
        run: |
          BASE_PATH=/admin/ PORT=3000 pnpm --filter @workspace/admin-panel run build
          pnpm --filter @workspace/api-server run build
